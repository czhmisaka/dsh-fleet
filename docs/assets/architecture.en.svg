<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="dsh-fleet architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6675"/>
    </marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <pattern id="agrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#abg)"/>
  <rect width="1200" height="560" rx="18" fill="url(#agrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="17.5" fill="none" stroke="#232a35"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="44" y="52" fill="#e8edf4" font-size="15" font-weight="700">dsh-fleet architecture</text>
    <text x="44" y="74" fill="#7d8794" font-size="11.5">the browser only talks to loopback · the master aggregates · slaves stay read-only</text>

    <!-- Browser -->
    <rect x="44" y="232" width="168" height="100" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="62" y="264" fill="#dfe6ef" font-size="13" font-weight="600">Browser</text>
    <text x="62" y="286" fill="#7d8794" font-size="10.5">one panel / one origin</text>
    <text x="62" y="306" fill="#7d8794" font-size="10.5">no remote credentials</text>

    <!-- Master -->
    <rect x="252" y="196" width="214" height="168" rx="12" fill="#0f1d18" stroke="#1f6f55"/>
    <text x="270" y="226" fill="#cfe8dd" font-size="13" font-weight="700">master DSH</text>
    <text x="270" y="248" fill="#7fe7c4" font-size="10.5">/fleet/* routes</text>
    <text x="270" y="268" fill="#7d8794" font-size="10.5">aggregation · SWR cache</text>
    <text x="270" y="288" fill="#7d8794" font-size="10.5">remote cookies in credentials</text>
    <text x="270" y="308" fill="#7d8794" font-size="10.5">loopback proxies (DSH + panel)</text>
    <text x="270" y="328" fill="#7d8794" font-size="10.5">in-panel viewer · usage</text>
    <text x="270" y="348" fill="#7d8794" font-size="10.5">native assistant · launch · budgets</text>

    <!-- DSH proxy -->
    <rect x="520" y="118" width="212" height="90" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="538" y="146" fill="#dfe6ef" font-size="12" font-weight="600">loopback proxy</text>
    <text x="538" y="166" fill="#7fe7c4" font-size="10.5">127.0.0.1:37801</text>
    <text x="538" y="184" fill="#7d8794" font-size="10">own origin · cookie injected</text>
    <text x="538" y="200" fill="#7d8794" font-size="10">content-addressed asset cache</text>

    <!-- panel proxy -->
    <rect x="520" y="288" width="212" height="90" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="538" y="316" fill="#dfe6ef" font-size="12" font-weight="600">loopback proxy</text>
    <text x="538" y="336" fill="#7fe7c4" font-size="10.5">127.0.0.1:37802</text>
    <text x="538" y="354" fill="#7d8794" font-size="10">dashboard origin</text>
    <text x="538" y="370" fill="#7d8794" font-size="10">embedded in its own process</text>

    <!-- remote DSH -->
    <rect x="792" y="118" width="204" height="90" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="810" y="146" fill="#dfe6ef" font-size="12" font-weight="600">remote DSH</text>
    <text x="810" y="166" fill="#8b96a5" font-size="10.5">:3080 · web UI + API</text>
    <text x="810" y="184" fill="#b8a6f5" font-size="10">dsh-context plugin (optional)</text>
    <text x="810" y="200" fill="#7d8794" font-size="10">sessions · models · usage</text>

    <!-- remote panel -->
    <rect x="792" y="288" width="204" height="90" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="810" y="316" fill="#dfe6ef" font-size="12" font-weight="600">remote dashboard</text>
    <text x="810" y="336" fill="#8b96a5" font-size="10.5">:40005 · monitoring</text>
    <text x="810" y="354" fill="#7d8794" font-size="10">CPU / memory / GPU</text>
    <text x="810" y="370" fill="#7d8794" font-size="10">embedded or new tab</text>

    <!-- agent -->
    <rect x="252" y="420" width="214" height="86" rx="12" fill="#10141b" stroke="#2a3140"/>
    <text x="270" y="448" fill="#dfe6ef" font-size="12" font-weight="600">agent role (each slave)</text>
    <text x="270" y="468" fill="#8b96a5" font-size="10.5">/fleet-agent/* · X-Fleet-Key</text>
    <text x="270" y="486" fill="#7d8794" font-size="10">reads local sessions + panel</text>

    <!-- links -->
    <line x1="212" y1="282" x2="248" y2="282" stroke="#34d399" stroke-width="1.8" marker-end="url(#ah-g)"/>

    <path d="M466 248 L520 166" stroke="#5b6675" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
    <path d="M466 316 L520 330" stroke="#5b6675" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

    <line x1="732" y1="163" x2="788" y2="163" stroke="#5b6675" stroke-width="1.6" marker-end="url(#ah)"/>
    <line x1="732" y1="333" x2="788" y2="333" stroke="#5b6675" stroke-width="1.6" marker-end="url(#ah)"/>

    <line x1="352" y1="364" x2="352" y2="416" stroke="#5b6675" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <text x="364" y="394" fill="#7d8794" font-size="9.5">/fleet-agent/* · read-only data</text>

    <text x="44" y="534" fill="#6b7684" font-size="10">remote cookies never reach the browser · proxies bind 127.0.0.1 only · instances can run on hosts or CubeSandbox</text>
  </g>
</svg>
