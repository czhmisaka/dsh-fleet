<svg xmlns="http://www.w3.org/2000/svg" width="380" height="560" viewBox="0 0 380 560" role="img" aria-label="dsh-fleet native assistant">
  <defs><linearGradient id="nabg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10141b"/><stop offset="1" stop-color="#0c0f14"/></linearGradient></defs>
  <rect width="380" height="560" rx="14" fill="url(#nabg)"/>
  <rect x="0.5" y="0.5" width="379" height="559" rx="13.5" fill="none" stroke="#232a35"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="16" y="28" fill="#e8edf4" font-size="12.5" font-weight="700">DSH assistant</text>
    <text x="128" y="28" fill="#6b7684" font-size="9.5">assign · dispatch · manage</text>
    <line x1="0" y1="42" x2="380" y2="42" stroke="#232a35"/>
    <text x="16" y="62" fill="#8b96a5" font-size="10">▍ Session · fleet assistant</text>

    <rect x="150" y="76" width="214" height="28" rx="9" fill="#14352a"/>
    <text x="162" y="94" fill="#d8f7ea" font-size="10.5">How is the comic-drama task?</text>

    <rect x="16" y="116" width="300" height="30" rx="8" fill="#181d25"/>
    <text x="28" y="135" fill="#9aa4b2" font-size="10">◍ fleetctl sessions --instance host-b</text>

    <rect x="16" y="154" width="336" height="120" rx="9" fill="#181d25"/>
    <text x="28" y="174" fill="#c9d2dc" font-size="10.5">Running — queue running=1</text>
    <text x="28" y="192" fill="#9aa4b2" font-size="10">· E04, E02 clips landed at 15:25 / 15:27</text>
    <text x="28" y="208" fill="#9aa4b2" font-size="10">· E06/E08/E10 still rendering (~30–50 min)</text>
    <text x="28" y="224" fill="#9aa4b2" font-size="10">· delivered: v3 final (10 shots, 1:16)</text>
    <text x="28" y="248" fill="#6b7684" font-size="9">tools · fleetctl · bash · session history</text>

    <rect x="16" y="286" width="336" height="1" fill="#232a35"/>
    <rect x="16" y="298" width="336" height="92" rx="9" fill="#151b23" stroke="#2a3140"/>
    <text x="28" y="318" fill="#6b7684" font-size="9.5">streaming answer · full DSH toolbox</text>
    <text x="28" y="336" fill="#c9d2dc" font-size="10.5">Ask, or run a tool, in a real DSH session</text>
    <text x="28" y="352" fill="#9aa4b2" font-size="10">embedded from master · same auth &amp; models</text>
    <text x="28" y="372" fill="#7fe7c4" font-size="10">AGENTS.md → dispatch to managed hosts first</text>

    <rect x="16" y="440" width="298" height="44" rx="10" fill="#151b23" stroke="#2a3140"/>
    <text x="28" y="458" fill="#6b7684" font-size="9.5">Message, or type / for commands</text>
    <text x="28" y="474" fill="#6b7684" font-size="9.5">@ for files · ↑ for history</text>
    <rect x="322" y="440" width="30" height="44" rx="10" fill="#0f2a22" stroke="#1f6f55"/>
    <text x="330" y="467" fill="#7fe7c4" font-size="13">↑</text>
    <text x="16" y="520" fill="#5b6674" font-size="9">native iframe · streaming · markdown · tools · model picker</text>
  </g>
</svg>
