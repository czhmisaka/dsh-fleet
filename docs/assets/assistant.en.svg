<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-label="dsh-fleet assistant">
  <defs>
    <linearGradient id="asbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10141b"/><stop offset="1" stop-color="#0c0f14"/></linearGradient>
  </defs>
  <rect width="360" height="560" rx="14" fill="url(#asbg)"/>
  <rect x="0.5" y="0.5" width="359" height="559" rx="13.5" fill="none" stroke="#232a35"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="16" y="30" fill="#e8edf4" font-size="12.5" font-weight="700">DSH assistant</text>
    <text x="112" y="30" fill="#6b7684" font-size="10">assign · dispatch · manage</text>
    <text x="330" y="30" fill="#7d8794" font-size="14">×</text>
    <line x1="0" y1="44" x2="360" y2="44" stroke="#232a35"/>

    <rect x="120" y="58" width="224" height="30" rx="9" fill="#14352a"/>
    <text x="132" y="77" fill="#d8f7ea" font-size="10.5">dispatch to /data/proj: run regression</text>

    <rect x="16" y="98" width="268" height="46" rx="9" fill="#181d25"/>
    <text x="28" y="117" fill="#c9d2dc" font-size="10.5">Dispatched to 「host-b」 (folder /data/proj),</text>
    <text x="28" y="133" fill="#c9d2dc" font-size="10.5">task queued.</text>
    <rect x="28" y="140" width="60" height="0" rx="0" fill="none"/>
    <text x="28" y="158" fill="#4ade80" font-size="10">Open session ↗</text>

    <rect x="152" y="162" width="192" height="26" rx="9" fill="#14352a"/>
    <text x="164" y="179" fill="#d8f7ea" font-size="10.5">usage today?</text>

    <rect x="16" y="198" width="300" height="92" rx="9" fill="#181d25"/>
    <text x="28" y="217" fill="#c9d2dc" font-size="10.5">Today 869M tokens · $14.53</text>
    <text x="28" y="234" fill="#9aa4b2" font-size="10">· host-a 612M · $9.64 · cache 97%</text>
    <text x="28" y="250" fill="#9aa4b2" font-size="10">· host-b 242M · $4.55 · cache 96%</text>
    <text x="28" y="266" fill="#9aa4b2" font-size="10">· host-c 15M · $0.34 · cache 90%</text>
    <text x="28" y="282" fill="#6b7684" font-size="9.5">one offline host skipped</text>

    <rect x="16" y="304" width="330" height="1" fill="#232a35"/>
    <g>
      <rect x="16" y="316" width="76" height="22" rx="11" fill="#151b23" stroke="#2a3140"/><text x="26" y="331" fill="#9aa4b2" font-size="9.5">Fleet summary</text>
      <rect x="100" y="316" width="86" height="22" rx="11" fill="#151b23" stroke="#2a3140"/><text x="110" y="331" fill="#9aa4b2" font-size="9.5">Running</text>
      <rect x="194" y="316" width="76" height="22" rx="11" fill="#151b23" stroke="#2a3140"/><text x="204" y="331" fill="#9aa4b2" font-size="9.5">Usage</text>
      <rect x="16" y="344" width="92" height="22" rx="11" fill="#151b23" stroke="#2a3140"/><text x="26" y="359" fill="#9aa4b2" font-size="9.5">Resume all</text>
      <rect x="116" y="344" width="66" height="22" rx="11" fill="#151b23" stroke="#2a3140"/><text x="126" y="359" fill="#9aa4b2" font-size="9.5">Help</text>
    </g>

    <rect x="16" y="382" width="290" height="40" rx="9" fill="#151b23" stroke="#2a3140"/>
    <text x="28" y="399" fill="#6b7684" font-size="9.5">e.g. dispatch to /data/proj:</text>
    <text x="28" y="413" fill="#6b7684" font-size="9.5">run the regression suite</text>
    <rect x="314" y="382" width="30" height="40" rx="9" fill="#0f2a22" stroke="#1f6f55"/>
    <text x="322" y="407" fill="#7fe7c4" font-size="12">↑</text>

    <text x="16" y="448" fill="#5b6674" font-size="9">Real DSH session · dispatches to slaves first</text>
  </g>
</svg>
